            '--workpath' 'backend/.pyinstaller/build'
            '--specpath' 'backend/.pyinstaller/spec'
            '--additional-hooks-dir' 'backend/.pyinstaller/hooks'
            '--runtime-hook' 'backend/.pyinstaller/hooks/rthook-snownlp.py'
            '--collect-submodules' 'snownlp'
            '--collect-submodules' 'jieba'
            '--collect-submodules' 'wordcloud'
            '--hidden-import' 'aiosqlite'
