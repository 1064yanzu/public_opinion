  release:
    needs: [build-windows, build-macos-arm, build-macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "舆情洞察 ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/public-opinion-Windows/*.exe
            artifacts/public-opinion-macOS-ARM/*.dmg
            artifacts/public-opinion-macOS-Intel/*.dmg
          body: |
            ## 舆情洞察 ${{ github.ref_name }}

            ### 系统要求

            - **Windows**：Windows 10 1903 (May 2019 Update) 或更高版本，64 位。
              首次安装会自动检测并提示安装 WebView2 Runtime（如已安装则跳过）。
            - **macOS**：macOS 11 Big Sur 或更高版本。

            ### 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `*-x64-setup.exe` | Windows 10/11 64位 安装包（中文界面） |
            | macOS (Apple Silicon) | `*-aarch64.dmg` | M1/M2/M3/M4 Mac |
            | macOS (Intel) | `*-x64.dmg` | Intel Mac |

            ### 本版本性能改进

            - 后端打包改为 onedir 模式：冷启动时间从约 30-60 秒压缩到 3-8 秒
            - Windows 安装器加入中文界面、发行方信息，减少杀软误报
            - 微博爬虫全面异步化，采集过程不再阻塞其他接口
            - 日志自动轮转，长期运行不再无限占盘

            ### macOS 安装注意

            首次打开可能提示"无法验证开发者"。请在 **系统设置 → 隐私与安全性** 中点击"仍要打开"。
            或右键点击应用选择"打开"。
