name: "Release Windows & macOS"
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Python Dependencies & Build Backend (Windows)
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

          # 准备资产目录
          mkdir frontend/src-tauri/resources/backend -Force
          mkdir backend/.pyinstaller/assets -Force

          # 复制字体文件
          if (Test-Path "三极泼墨体.ttf") {
            Copy-Item "三极泼墨体.ttf" -Destination "backend/.pyinstaller/assets/sanjipomoti.ttf"
          }

          # ===== 关键修复: 找到并显式打包 MSVC 运行时 DLL =====
          # 一份在 System32 (x64)，一份在 SysWOW64 (x86)；干净 Windows 上 Python 目录里也可能没有
          $pythonDir = python -c "import sys; print(sys.prefix)"
          $crtDlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          $crtArgs = @()
          $searchRoots = @(
            $pythonDir,
            (Join-Path $env:SystemRoot "System32"),
            (Join-Path $env:SystemRoot "SysWOW64")
          )
          foreach ($dll in $crtDlls) {
            $found = $false
            foreach ($root in $searchRoots) {
              $dllPath = Join-Path $root $dll
              if (Test-Path $dllPath) {
                Write-Host "Found CRT DLL: $dllPath"
                $crtArgs += @('--add-binary', "${dllPath};.")
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "WARNING: CRT DLL not found in any search root: $dll"
            }
          }

          # 构建 PyInstaller 参数 — onedir 模式
          $pyinstallerArgs = @(
            '--noconfirm',
            '--clean',
            # 关键变更：--onedir 替代 --onefile
            # 安装时一次解压，运行时不再触发杀软实时扫描；
            # 启动时间从 30-60 秒压缩到 3-8 秒。
            '--onedir',
            '--name', 'public_opinion_backend',
            '--distpath', 'frontend/src-tauri/resources/backend',
            '--workpath', 'backend/.pyinstaller/build',
            '--specpath', 'backend/.pyinstaller/spec',
            '--win-private-assemblies',
            '--win-no-prefer-redirects',
            '--additional-hooks-dir', 'backend/.pyinstaller/hooks',
            '--runtime-hook', 'backend/.pyinstaller/hooks/rthook-snownlp.py',
            # hooks 已 collect_data_files，--collect-all 会重复打包；仅 submodules
            '--collect-submodules', 'snownlp',
            '--collect-submodules', 'jieba',
            '--collect-submodules', 'wordcloud',
            '--hidden-import', 'aiosqlite',
            '--collect-submodules', 'passlib.handlers',
            # 排除明确未使用的重型模块
            '--exclude-module', 'tkinter',
            '--exclude-module', 'matplotlib',
            '--exclude-module', 'scipy',
            '--exclude-module', 'IPython',
            '--exclude-module', 'unittest',
            '--exclude-module', 'pydoc',
            '--exclude-module', 'test',
            '--exclude-module', 'tests',
            '--exclude-module', 'PIL.ImageQt',
            '--exclude-module', 'PIL.ImageTk',
            '--exclude-module', 'numpy.tests'
          )

          # 追加 CRT DLL 参数
          $pyinstallerArgs += $crtArgs

          if (Test-Path "backend/.pyinstaller/assets/sanjipomoti.ttf") {
            $pyinstallerArgs += @('--add-data', "backend/.pyinstaller/assets/sanjipomoti.ttf;.")
          }

          $pyinstallerArgs += 'backend/run_desktop.py'
          & pyinstaller @pyinstallerArgs

          # onedir 模式输出: frontend/src-tauri/resources/backend/public_opinion_backend/public_opinion_backend.exe
          $backendBundleDir = "frontend/src-tauri/resources/backend/public_opinion_backend"
          $backendExe = "$backendBundleDir/public_opinion_backend.exe"
          if (Test-Path $backendExe) {
            $sizeBytes = (Get-ChildItem -Recurse $backendBundleDir | Measure-Object -Property Length -Sum).Sum
            Write-Host "Backend built successfully: $backendExe (bundle total $([math]::Round($sizeBytes / 1MB, 1)) MB)"
          } else {
            Write-Error "Backend build failed: $backendExe not found"
            exit 1
          }

      - name: Verify Backend Binary (Windows)
        run: |
          $backendExe = "frontend/src-tauri/resources/backend/public_opinion_backend/public_opinion_backend.exe"

          Write-Host "=== 后端二进制验证 ==="

          if (-not (Test-Path $backendExe)) {
            Write-Error "验证失败: 后端二进制文件不存在"
            exit 1
          }
          Write-Host "✓ 文件存在: $backendExe"

          $size = (Get-Item $backendExe).Length
          if ($size -lt 1MB) {
            Write-Error "验证失败: 文件过小 ($size 字节)，可能不完整"
            exit 1
          }
          Write-Host "✓ 文件大小: $([math]::Round($size / 1MB, 1)) MB"

          $bytes = [System.IO.File]::ReadAllBytes($backendExe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "验证失败: 不是有效的 PE 可执行文件"
            exit 1
          }
          Write-Host "✓ 文件格式: PE 可执行文件"

          # onedir 模式应该有同级 _internal 目录
          $internalDir = "frontend/src-tauri/resources/backend/public_opinion_backend/_internal"
          if (Test-Path $internalDir) {
            Write-Host "✓ onedir 结构: _internal/ 存在"
          } else {
            Write-Warning "未发现 _internal/ 目录，可能 PyInstaller 版本较旧（仍 OK，文件结构略不同）"
          }

          Write-Host "`n=== 验证完成 ==="

      - name: Build Tauri App (Windows)
        working-directory: frontend
        run: npx tauri build --config src-tauri/tauri.windows.bundle.conf.json --target x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-opinion-Windows
          path: |
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-arm-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm-cargo-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Python Dependencies & Build Backend (macOS ARM)
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

          mkdir -p frontend/src-tauri/resources/backend
          mkdir -p backend/.pyinstaller/assets

          if [ -f "三极泼墨体.ttf" ]; then
            cp "三极泼墨体.ttf" "backend/.pyinstaller/assets/sanjipomoti.ttf"
          fi

          # onedir 构建参数
          PYINSTALLER_ARGS=(
            '--noconfirm'
            '--clean'
            '--onedir'
            '--name' 'public_opinion_backend'
            '--distpath' 'frontend/src-tauri/resources/backend'
            '--workpath' 'backend/.pyinstaller/build'
            '--specpath' 'backend/.pyinstaller/spec'
            '--additional-hooks-dir' 'backend/.pyinstaller/hooks'
            '--runtime-hook' 'backend/.pyinstaller/hooks/rthook-snownlp.py'
            '--collect-submodules' 'snownlp'
            '--collect-submodules' 'jieba'
            '--collect-submodules' 'wordcloud'
            '--hidden-import' 'aiosqlite'
            '--collect-submodules' 'passlib.handlers'
            '--exclude-module' 'tkinter'
            '--exclude-module' 'matplotlib'
            '--exclude-module' 'scipy'
            '--exclude-module' 'IPython'
            '--exclude-module' 'unittest'
            '--exclude-module' 'pydoc'
            '--exclude-module' 'test'
            '--exclude-module' 'tests'
            '--exclude-module' 'PIL.ImageQt'
            '--exclude-module' 'PIL.ImageTk'
            '--exclude-module' 'numpy.tests'
          )

          if [ -f "backend/.pyinstaller/assets/sanjipomoti.ttf" ]; then
            PYINSTALLER_ARGS+=("--add-data" "backend/.pyinstaller/assets/sanjipomoti.ttf:.")
          fi

          PYINSTALLER_ARGS+=('backend/run_desktop.py')
          pyinstaller "${PYINSTALLER_ARGS[@]}"

          chmod +x frontend/src-tauri/resources/backend/public_opinion_backend/public_opinion_backend

      - name: Verify Backend Binary (macOS ARM)
        run: |
          BACKEND_BIN="frontend/src-tauri/resources/backend/public_opinion_backend/public_opinion_backend"

          echo "=== 后端二进制验证 ==="
          if [ ! -f "$BACKEND_BIN" ]; then
            echo "验证失败: 后端二进制文件不存在"
            ls -la frontend/src-tauri/resources/backend/ || true
            exit 1
          fi
          echo "✓ 文件存在: $BACKEND_BIN"

          SIZE=$(stat -f%z "$BACKEND_BIN" 2>/dev/null || stat -c%s "$BACKEND_BIN")
          if [ "$SIZE" -lt 1048576 ]; then
            echo "验证失败: 文件过小 ($SIZE 字节)，可能不完整"
            exit 1
          fi
          echo "✓ 文件大小: $(echo "scale=1; $SIZE / 1048576" | bc) MB"

          if ! file "$BACKEND_BIN" | grep -q "Mach-O"; then
            echo "验证失败: 不是有效的 Mach-O 可执行文件"
            exit 1
          fi
          echo "✓ 文件格式: Mach-O 可执行文件"

          if [ ! -x "$BACKEND_BIN" ]; then
            echo "验证失败: 文件不可执行"
            exit 1
          fi
          echo "✓ 文件权限: 可执行"

          echo ""
          echo "=== 验证完成 ==="

      - name: Build Tauri App (macOS ARM)
        working-directory: frontend
        # 仅生成 dmg，省去 app.tar.gz 重复打包时间
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --target aarch64-apple-darwin --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS ARM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-opinion-macOS-ARM
          path: |
            frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

