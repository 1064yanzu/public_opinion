  release:
    needs: [build-windows, build-macos-arm, build-macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "舆情洞察 ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/public-opinion-Windows/*.exe
            artifacts/public-opinion-macOS-ARM/*.dmg
            artifacts/public-opinion-macOS-ARM/*.app.tar.gz
            artifacts/public-opinion-macOS-Intel/*.dmg
            artifacts/public-opinion-macOS-Intel/*.app.tar.gz
          body: |
            ## 舆情洞察 ${{ github.ref_name }}

            ### 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `*-x64-setup.exe` | Windows 10/11 64位 安装包 |
            | macOS (Apple Silicon) | `*-aarch64.dmg` | M1/M2/M3/M4 Mac |
            | macOS (Intel) | `*-x64.dmg` | Intel Mac |

            ### macOS 安装注意

            首次打开可能提示"无法验证开发者"。请在 **系统设置 → 隐私与安全性** 中点击"仍要打开"。
            或右键点击应用选择"打开"。
